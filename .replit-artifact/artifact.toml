kind = "web"
previewPath = "/"
title = "맛집맵"
version = "1.0.0"
id = "artifacts/matjip-map"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20765

[services.development]
run = "pnpm --filter @workspace/matjip-map run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matjip-map", "run", "build" ]
serve = "static"
publicDir = "artifacts/matjip-map/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20765"
BASE_PATH = "/"
